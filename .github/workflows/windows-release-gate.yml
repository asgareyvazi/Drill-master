name: Windows release validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-release:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      DRILLMASTER_AI_IMPORT: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Pinned Inno Setup installation failed" }
          $isccDir = 'C:\Program Files (x86)\Inno Setup 6'
          if (-not (Test-Path (Join-Path $isccDir 'ISCC.exe'))) { throw 'ISCC.exe was not installed' }
          Add-Content $env:GITHUB_PATH $isccDir
      - name: Install locked test runtime
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt pytest==9.1.1
      - name: Windows database, import, auth and packaging regression suite
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP "DrillMaster-M42-tests-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
          $env:DRILLMASTER_ENV = 'test'
          $env:DRILLMASTER_DATA_DIR = Join-Path $testRoot 'data'
          $env:DRILLMASTER_DB_PATH = Join-Path $testRoot 'data\acceptance.db'
          $env:DRILLMASTER_LOG_DIR = Join-Path $testRoot 'logs'
          $env:DRILLMASTER_BACKUP_DIR = Join-Path $testRoot 'backups'
          $testReport = Join-Path $testRoot 'windows-regressions.xml'
          $testSummary = Join-Path $testRoot 'windows-regression-summary.md'
          $testReportJson = Join-Path $testRoot 'windows-regression-report.json'
          python -m pytest -ra -q tests/test_packaging_smoke.py tests/test_acceptance_report.py tests/test_release_smoke.py tests/test_credential_lifecycle.py tests/test_wellbore_schema_v3.py tests/test_wellbore_ownership_integrity.py tests/test_wellbore_discriminator_import.py tests/test_wellbore_identity_conflict_m25.py tests/test_p0_well_identity.py tests/test_history_well_scope.py tests/test_whole_well_scope_labels_m25.py tests/test_release_gate_and_w13.py tests/test_w13_ecd_chart_fallback.py tests/test_w13_fishing_result_ui.py tests/test_m38_domain_boundaries.py tests/test_m31_scenarios.py tests/test_well_centric_acceptance.py tests/test_production_import_guarantees.py tests/test_ddr_forensic_regressions.py tests/test_ddr_followup_lifecycle.py tests/test_database_migration_acceptance.py tests/test_backup_restore_acceptance.py tests/test_import_atomicity_acceptance.py tests/test_release_e2e.py tests/test_junit_report.py tests/test_windows_release_gate_contract.py "--junitxml=$testReport"
          $pytestExit = $LASTEXITCODE
          # GitHub publishes at most ten annotations per step.  packaging/junit_report.py
          # emits one per failure up to that cap, an aggregate annotation carrying every
          # remaining identity, and a Markdown job summary that is never truncated.
          python packaging\junit_report.py --junit "$testReport" --summary-out "$testSummary" --json-out "$testReportJson" --annotations
          if (Test-Path -LiteralPath $testSummary) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value (Get-Content -LiteralPath $testSummary -Raw) -Encoding utf8
          }
          if ($pytestExit -ne 0) {
            throw "Windows release regression suite failed (pytest exit $pytestExit); every failing test is listed in the job summary and workflow annotations"
          }
      - name: Build portable bundle and installer; run frozen executable smoke
        id: build
        shell: pwsh
        run: |
          $releaseRoot = Join-Path $env:RUNNER_TEMP "DrillMaster-release-$env:GITHUB_RUN_ID"
          # Publish the release directory before building: the evidence upload runs on
          # always(), so a step that set this only on success would upload nothing when
          # the build failed -- which is exactly how a packaging failure became unreadable.
          "release_dir=$releaseRoot" | Add-Content $env:GITHUB_OUTPUT
          $transcript = Join-Path $env:RUNNER_TEMP "DrillMaster-build-transcript-$env:GITHUB_RUN_ID.txt"
          # Stop makes a terminating error thrown inside build_windows.ps1 end this step
          # here; with the pwsh default it would be reported and execution would continue
          # into the artifact assertions, mislabelling a build failure as a missing file.
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath Variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $transcriptStarted = $false
          try { Start-Transcript -Path $transcript | Out-Null; $transcriptStarted = $true } catch {
            Write-Output "::warning title=Build transcript unavailable::Start-Transcript failed; the stage annotation still carries the failure reason"
          }
          $stageError = $null
          try {
            # Free space is recorded because a duplicated build environment (locked runtime
            # plus PyInstaller work and output) is a realistic Windows runner failure mode,
            # and the value is otherwise invisible once the log endpoint is unreachable.
            $freeBytes = (Get-PSDrive -Name $releaseRoot.Substring(0, 1)).Free
            Write-Output "Runner volume free bytes before build: $freeBytes"
            # Use the interpreter this job provisioned and installed the locked runtime
            # with.  The "py" launcher enumerates registry-registered runtimes, not the
            # Actions tool cache, so it can select a different Python than the tested one.
            $pythonExe = (Get-Command python).Source
            Write-Output "Build interpreter: $pythonExe"
            & .\packaging\build_windows.ps1 -PythonExe $pythonExe -PythonVersion '3.12' -OutputDir $releaseRoot
            if ($LASTEXITCODE -ne 0) { throw "Windows portable/installer build script failed (exit $LASTEXITCODE)" }
            $version = (python -c 'from core.version import __version__; print(__version__)').Trim()
            $bundle = Join-Path $releaseRoot "DrillMaster-$version"
            $exe = Join-Path $bundle 'DrillMaster.exe'
            if (-not (Test-Path $exe)) { throw 'Frozen executable missing' }
            $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
            if (-not $productVersion.StartsWith($version)) { throw "Executable version '$productVersion' differs from authoritative '$version'" }
            $installer = Join-Path $releaseRoot "DrillMaster-$version-Setup.exe"
            if (-not (Test-Path $installer)) { throw 'Compiled installer missing' }
            $metadata = Get-Content (Join-Path $releaseRoot 'release-metadata.json') -Raw | ConvertFrom-Json
            if ($metadata.git_sha -ne $env:GITHUB_SHA) { throw 'Artifact metadata SHA differs from workflow SHA' }
            if ($metadata.version -ne $version -or $metadata.platform -ne 'windows-x64') { throw 'Artifact metadata version/platform mismatch' }
            foreach ($artifact in $metadata.artifacts) {
              $artifactPath = Join-Path $releaseRoot ($artifact.filename -replace '/', '\\')
              $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifactPath).Hash.ToLowerInvariant()
              if ($actualHash -ne $artifact.sha256) { throw "Artifact SHA256 mismatch: $($artifact.filename)" }
            }
            $checksumsPath = Join-Path $releaseRoot 'SHA256SUMS.txt'
            if (-not (Test-Path $checksumsPath)) { throw 'SHA256SUMS.txt missing' }
            $expectedChecksums = @($metadata.artifacts | ForEach-Object { "$($_.sha256)  $($_.filename)" })
            $actualChecksums = @(Get-Content -LiteralPath $checksumsPath)
            if ($actualChecksums.Count -ne $expectedChecksums.Count) { throw 'SHA256SUMS entry count differs from release metadata' }
            foreach ($line in $expectedChecksums) {
              if ($actualChecksums -notcontains $line) { throw "SHA256SUMS entry missing: $line" }
            }
            $testReport = Join-Path $env:RUNNER_TEMP "DrillMaster-M42-tests-$env:GITHUB_RUN_ID\windows-regressions.xml"
            $metadataPath = Join-Path $releaseRoot 'release-metadata.json'
            $acceptanceReport = Join-Path $releaseRoot 'acceptance-report.json'
            python packaging\acceptance_report.py --metadata $metadataPath --junit $testReport --source-sha $env:GITHUB_SHA --output $acceptanceReport `
              --ci-workflow "$env:GITHUB_WORKFLOW" --ci-run-id "$env:GITHUB_RUN_ID" --ci-branch "$env:GITHUB_REF_NAME" `
              --ci-run-url "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            if ($LASTEXITCODE -ne 0) { throw 'Machine-readable Windows acceptance report generation failed' }
          } catch {
            $stageError = $_
          } finally {
            if ($transcriptStarted) { Stop-Transcript | Out-Null }
          }
          if ($null -ne $stageError) {
            # Annotations are the only diagnostics that survive a runner whose log and
            # artifact endpoints are unreachable; the helper bounds and redacts them.
            # They are emitted after the transcript is closed: a still-open transcript has
            # not flushed native command output yet, which is what left the previous
            # packaging failure with a header-only tail and no stated reason.
            python packaging\junit_report.py --annotate --annotate-title 'Windows packaging stage failed' --annotate-message "$($stageError.Exception.Message)" --annotate-file $transcript --annotate-file (Join-Path $releaseRoot 'pip-install.log') --annotate-file (Join-Path $releaseRoot 'pyinstaller-build.log')
            if ($LASTEXITCODE -ne 0) { Write-Output "::error title=Packaging diagnostics failed::the annotation helper itself exited non-zero" }
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### Windows packaging stage failed`n`n$($stageError.Exception.Message)" -Encoding utf8
            throw $stageError
          }
      - name: Upload Windows evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drillmaster-windows-${{ github.sha }}
          path: |
            ${{ steps.build.outputs.release_dir }}
            ${{ runner.temp }}/DrillMaster-M42-tests-${{ github.run_id }}/windows-regressions.xml
            ${{ runner.temp }}/DrillMaster-M42-tests-${{ github.run_id }}/windows-regression-summary.md
            ${{ runner.temp }}/DrillMaster-M42-tests-${{ github.run_id }}/windows-regression-report.json
            ${{ runner.temp }}/DrillMaster-build-transcript-${{ github.run_id }}.txt
          if-no-files-found: warn
          retention-days: 30
