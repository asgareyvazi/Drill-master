name: PySide6 candidate evaluation (M324, isolated)
# Evaluation only. requirements-lock.txt keeps PySide6 6.8.1.1; each job installs the lock and then overlays ONE
# candidate PySide6 / Essentials / Addons / shiboken6 set in its throw-away runner environment. Nothing here changes
# the product pin. The decision (M325) belongs to the owner; see
# docs/mission-reports/m321-m360-evidence/m324_pyside_upgrade_decision.md.
on:
  push:
    paths:
      - '.github/workflows/pyside-candidate-evaluation.yml'
      - 'tools/quality/pyside_eval/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pyside-eval-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
        pyside: ['6.8.2.1', '6.8.3']
        include:
          # baseline: does the Python 3.13 hang (run 45115378469) also happen on the shipped pin, where windows are
          # retained (product mode only - auto mode on 6.8.1.1 is the known D63 crash)?
          - python: '3.13'
            pyside: '6.8.1.1'
    env:
      QT_QPA_PLATFORM: offscreen
      DRILLMASTER_AI_IMPORT: '0'
      DRILLMASTER_ENV: test
      PYTHONPATH: .:tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Real Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: gdb for native stacks of a hung probe (D51, Python 3.13 only)
        if: matrix.python == '3.13'
        run: |
          sudo apt-get install -y gdb
          sudo sysctl -w kernel.yama.ptrace_scope=0
      - name: Locked runtime, then the candidate overlay
        run: |
          python -m pip install -r requirements-lock.txt pytest==9.1.1
          python -m pip install --no-deps "PySide6==${{ matrix.pyside }}" "PySide6-Essentials==${{ matrix.pyside }}" "PySide6-Addons==${{ matrix.pyside }}" "shiboken6==${{ matrix.pyside }}"
          python -c "import PySide6, shiboken6, sys; print('python', sys.version.split()[0], 'PySide6', PySide6.__version__, 'shiboken6', shiboken6.__version__)"
      - name: D63 window-release probe (auto and product policy)
        run: |
          if [ "${{ matrix.python }}" = "3.13" ]; then
            # D51 / M324 §3e: probe as the application runs - core.qt_gc installed (M50: cyclic GC only on the GUI
            # thread). 6.8.1.1 keeps product mode only (auto mode on 6.8.1.1 is the known D63 crash).
            modes="auto,product"; if [ "${{ matrix.pyside }}" = "6.8.1.1" ]; then modes="product"; fi
            python tools/quality/pyside_eval/probe_loop.py --runs 8 --timeout 150 --native-dump --qt-gc --modes "$modes"
          else
            runs=3; modes="auto,product"; if [ "${{ matrix.pyside }}" = "6.8.1.1" ]; then modes="product"; fi
            python tools/quality/pyside_eval/probe_loop.py --runs "$runs" --modes "$modes"
          fi
      - name: D51 control (Python 3.13 candidates) - the same probe WITHOUT core.qt_gc, diagnostic only
        if: matrix.python == '3.13' && matrix.pyside != '6.8.1.1'
        run: python tools/quality/pyside_eval/probe_loop.py --runs 4 --timeout 150 --native-dump --diagnostic --modes auto,product
      - name: UI regression subset (322 tests locally on 6.8.1.1 / 6.8.2.1 / 6.8.3)
        run: python -m pytest -p no:cacheprovider -q $(cat tools/quality/pyside_eval/ui_tests.txt)
      - name: PyInstaller freeze smoke (product Qt modules)
        run: |
          python -m pip install -r requirements-build.txt
          cd tools/quality/pyside_eval
          python -m PyInstaller --noconfirm --onedir --log-level WARN --distpath "$RUNNER_TEMP/dist" --workpath "$RUNNER_TEMP/work" freeze_smoke.py
          "$RUNNER_TEMP/dist/freeze_smoke/freeze_smoke"
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 6.8.1.1 = the current pin without an overlay: the baseline that separates a candidate regression from a
        # pre-existing Windows-only failure of the subset (the subset is wider than the Windows release gate list).
        pyside: ['6.8.1.1', '6.8.2.1', '6.8.3']
    env:
      QT_QPA_PLATFORM: offscreen
      DRILLMASTER_AI_IMPORT: '0'
      DRILLMASTER_ENV: test
      PYTHONPATH: .;tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Locked runtime and build tools, then the candidate overlay
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-lock.txt -r requirements-build.txt pytest==9.1.1
          if ('${{ matrix.pyside }}' -ne '6.8.1.1') { python -m pip install --no-deps "PySide6==${{ matrix.pyside }}" "PySide6-Essentials==${{ matrix.pyside }}" "PySide6-Addons==${{ matrix.pyside }}" "shiboken6==${{ matrix.pyside }}" }
          python -c "import PySide6, shiboken6, sys; print('python', sys.version.split()[0], 'PySide6', PySide6.__version__, 'shiboken6', shiboken6.__version__)"
      - name: D63 window-release probe (auto mode only on the pin, where it is the known crash)
        shell: pwsh
        run: |
          if ('${{ matrix.pyside }}' -eq '6.8.1.1') { python tools/quality/pyside_eval/probe_loop.py --runs 3 --modes product }
          else { python tools/quality/pyside_eval/probe_loop.py --runs 3 }
          exit $LASTEXITCODE
      - name: UI regression subset (failures annotated by test id)
        shell: pwsh
        run: |
          $tests = Get-Content tools/quality/pyside_eval/ui_tests.txt
          $junit = Join-Path $env:RUNNER_TEMP 'ui.xml'
          python -m pytest -p no:cacheprovider -q -rf @tests "--junitxml=$junit"
          $rc = $LASTEXITCODE
          python packaging\junit_report.py --junit $junit --annotations --pytest-exit $rc
          exit $rc
      - name: PyInstaller build of packaging/DrillMaster.spec and frozen package smoke
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'work'
          $dist = Join-Path $env:RUNNER_TEMP 'dist'
          $build = Join-Path $env:RUNNER_TEMP 'pyinstaller-build.log'
          $smoke = Join-Path $env:RUNNER_TEMP 'package-smoke.log'
          $ErrorActionPreference = 'Continue'
          # Runner checkout only (never committed): the smoke checks bundled licence metadata against the lock pins,
          # so the throw-away lock names the candidate. This is the M325 lock edit, rehearsed - not applied.
          if ('${{ matrix.pyside }}' -ne '6.8.1.1') {
            (Get-Content requirements-lock.txt) -replace '^(PySide6|PySide6_Addons|PySide6_Essentials|shiboken6)==6\.8\.1\.1$', ('$1==' + '${{ matrix.pyside }}') | Set-Content requirements-lock.txt
            Select-String -Path requirements-lock.txt -Pattern '^(PySide6|shiboken6)' | ForEach-Object { $_.Line }
          }
          python -m PyInstaller --noconfirm --clean --workpath $work --distpath $dist packaging\DrillMaster.spec *> $build
          $rc = $LASTEXITCODE
          if ($rc -ne 0) {
            python packaging\junit_report.py --annotate --annotate-title "PyInstaller build failed (PySide6 ${{ matrix.pyside }})" --annotate-message "PyInstaller exited $rc" --annotate-file $build --tail-lines 40
            exit $rc
          }
          python packaging\package_smoke.py --bundle-dir (Join-Path $dist 'DrillMaster') --run --log-path $smoke *> (Join-Path $env:RUNNER_TEMP 'smoke-console.log')
          $rc = $LASTEXITCODE
          if ($rc -ne 0) {
            python packaging\junit_report.py --annotate --annotate-title "Frozen package smoke failed (PySide6 ${{ matrix.pyside }})" --annotate-message "package_smoke exited $rc" --annotate-file $smoke --annotate-file (Join-Path $env:RUNNER_TEMP 'smoke-console.log') --tail-lines 40
          }
          exit $rc
